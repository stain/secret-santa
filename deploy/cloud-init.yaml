#cloud-config
# Server setup for Secret Santa on Ubuntu 24.04 LTS (Hetzner or UpCloud).
# Paste this as "user data" / "cloud-init" when creating the server, with
# your SSH key added in the provider's console. It installs Docker and git,
# turns on the firewall and automatic security updates, and disables SSH
# passwords. Then follow DEPLOYMENT.md to clone the app and start it.

package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - git
  - sqlite3
  - ufw
  - unattended-upgrades

write_files:
  # SSH keys only.
  - path: /etc/ssh/sshd_config.d/90-keys-only.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
  # Security updates every night; reboot at 04:30 UTC if one needs it
  # (the containers start again by themselves).
  - path: /etc/apt/apt.conf.d/52secret-santa-upgrades
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";
  # Container logs rotated by size, also for anything outside compose.yaml.
  - path: /etc/docker/daemon.json
    content: |
      { "log-driver": "json-file", "log-opts": { "max-size": "10m", "max-file": "3" } }

runcmd:
  - systemctl restart ssh
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443
  - ufw --force enable
  - systemctl enable --now docker
  - systemctl enable --now unattended-upgrades
